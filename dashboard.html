<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <title>Bakım Takip Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
    <!-- Açılış Ekranı (Splash Screen) -->
    <div class="splash-screen">
        <img src="AKGLOG.png" alt="AKG Logo" class="splash-logo">
        <h2 class="splash-text">Bakım Sistemine<br>Hoş Geldiniz</h2>
    </div>

    <div class="dashboard-container" style="max-width: 1400px;">
        <div class="glass-panel">
            <div class="dashboard-header">
                <div>
                    <h1>🔧 Arıza Takip Paneli</h1>
                </div>
                <div class="header-actions" style="display: flex; gap: 1rem; align-items: center;">
                    <!-- Admin Giriş Yapınca Görünecekler -->
                    <div id="adminPanel" style="display:none; align-items: center; gap: 1rem;">
                        <span style="color: var(--accent); font-weight: bold;">👑 Admin Aktif</span>
                        <a href="admin.html" style="color: white; text-decoration:none; background: rgba(255,255,255,0.1); padding: 0.5rem 1rem; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2);">⚙️ Ayarlar</a>
                    </div>

                    <!-- Herkese Açık Butonlar -->
                    <div id="publicPanel" style="display:flex; gap: 1rem;">
                        <button onclick="window.location.href='index.html'" style="margin:0; padding: 0.5rem 1rem; border-radius: 20px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; cursor: pointer; font-weight: 500; width:auto;">← Ana Sayfaya Dön</button>
                    </div>
                </div>
            </div>

            <!-- Bekleyen Arızalar Terminali -->
            <div class="terminal-container">
                <div class="terminal-body" id="faultTerminal">
                    <!-- Terminal Logları Buraya Gelecek -->
                </div>
            </div>

            <!-- Çözülen Arızalar Terminali -->
            <div class="terminal-container mt-4">
                <div class="terminal-body" id="resolvedTerminal">
                    <!-- Terminal Logları Buraya Gelecek -->
                </div>
            </div>
        </div>
    </div>

    <!-- Arıza Detay Modalı -->
    <div id="faultModal" class="modal-overlay hidden">
        <div class="modal-content" style="max-width: 500px;">
            <div class="modal-header">
                <h3 class="modal-title">Arıza Detayları</h3>
                <button class="close-modal" onclick="closeFaultModal()">&times;</button>
            </div>
            <div id="faultModalBody" style="margin-bottom: 1.5rem; line-height: 1.6; font-size: 0.95rem;">
                <!-- İçerik JS ile dolacak -->
            </div>
            <div id="faultModalActions" style="display: flex; justify-content: space-between; gap: 1rem; border-top: 1px solid var(--panel-border); padding-top: 1.5rem;">
                <!-- Aksiyonlar (Sil, Görevli Ata) buraya gelecek -->
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
