<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <title>İş İstek Formu</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #020617;
            --bg-grid: #0f172a;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --is: #22d3ee;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .form-container {
            width: 100%;
            max-width: 500px;
            background: var(--bg-grid);
            padding: 30px;
            border-radius: 16px;
            border: 2px solid var(--is);
            box-shadow: 0 10px 40px rgba(34, 211, 238, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 900;
            color: var(--is);
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: var(--text-dim);
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        input, select, textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #334155;
            padding: 12px;
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-size: 16px;
            font-weight: 600;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--is);
        }

        .submit-btn {
            width: 100%;
            background: var(--is);
            color: #000;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s, opacity 0.2s;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .photo-area {
            border: 2px dashed #334155;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }

        #foto-preview {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
            border: 2px solid var(--is);
        }

        #last-sync {
            position: fixed;
            top: 10px;
            right: 10px;
            font-size: 10px;
            color: var(--text-dim);
        }
    </style>
</head>

<body>
    <div id="last-sync">Bağlanıyor...</div>

    <div class="form-container">
        <div class="header">
            <h1>İŞ İSTEK FORMU</h1>
        </div>

        <div class="input-group">
            <label>İsteği Açan Kişi</label>
            <input type="text" id="new-acan" placeholder="Adınız Soyadınız">
        </div>

        <div class="input-group">
            <label>Makine / Bölüm</label>
            <select id="new-makine">
                <option value="">Yükleniyor...</option>
            </select>
        </div>

        <div class="input-group">
            <label>Vardiya</label>
            <select id="new-vardiya">
                <option value="1.VARDİYA 00:00 // 08:00">1.VARDİYA 00:00 // 08:00</option>
                <option value="2.VARDİYA 08:00 // 16:00" selected>2.VARDİYA 08:00 // 16:00</option>
                <option value="3.VARDİYA 16:00 // 00:00">3.VARDİYA 16:00 // 00:00</option>
            </select>
        </div>

        <div class="input-group">
            <label>İş Türü</label>
            <select id="new-tur">
                <option value="MEKANİK ARIZA">MEKANİK ARIZA</option>
                <option value="ELEKTRİK ARIZA">ELEKTRİK ARIZA</option>
                <option value="İSG GÜVENLİĞİ !!!">İSG GÜVENLİĞİ !!!</option>
                <option value="PLANLI BAKIM KODU">PLANLI BAKIM KODU</option>
                <option value="TEKRAR EDEN ARIZA !!!">TEKRAR EDEN ARIZA !!!</option>
                <option value="DİĞER">DİĞER</option>
            </select>
        </div>

        <div class="input-group">
            <label>Açıklama</label>
            <textarea id="new-aciklama" rows="3" placeholder="Detayları buraya yazın..."></textarea>
        </div>

        <div class="photo-area">
            <label style="margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 5px;">
                <span class="material-icons">photo_camera</span> Fotoğraf Ekle
            </label>
            <input type="file" id="new-foto" accept="image/*" style="display:none;" onchange="previewImage(event)">
            <button onclick="document.getElementById('new-foto').click()" style="background: #334155; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold;">Resim Seç</button>
            <img id="foto-preview">
        </div>

        <button id="submit-btn" class="submit-btn" onclick="submitRequest()">KAYDI GÖNDER</button>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzv1FO2PE-sQY5wI5D46BLW0-WxRbb9LKb-Im-kHtDdTKGf_ZiGpUBV6Drthyfp-RFN/exec';
        let currentImageBase64 = "";

        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const max = 1000;
                    if (width > height) {
                        if (width > max) { height *= max / width; width = max; }
                    } else {
                        if (height > max) { width *= max / height; height = max; }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    currentImageBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    
                    const preview = document.getElementById('foto-preview');
                    preview.src = currentImageBase64;
                    preview.style.display = 'block';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function fetchData() {
            fetch(API_URL + '?_t=' + Date.now())
                .then(r => r.json())
                .then(data => {
                    if (data.makineler) {
                        const select = document.getElementById('new-makine');
                        let html = '<option value="">Makine Seçin...</option>';
                        data.makineler.sort().forEach(m => {
                            if (m) html += `<option value="${m}">${m}</option>`;
                        });
                        select.innerHTML = html;
                        document.getElementById('last-sync').innerText = "Veri Güncel: " + new Date().toLocaleTimeString();
                    }
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('last-sync').innerText = "Bağlantı Hatası!";
                });
        }

        function submitRequest() {
            const acan = document.getElementById('new-acan').value.trim();
            const makine = document.getElementById('new-makine').value;
            const vardiya = document.getElementById('new-vardiya').value;
            const tur = document.getElementById('new-tur').value;
            const aciklama = document.getElementById('new-aciklama').value.trim();

            if (!acan || !makine || !aciklama) {
                alert("Lütfen Adınızı, Makineyi ve Açıklamayı doldurun!");
                return;
            }

            const btn = document.getElementById('submit-btn');
            btn.innerText = "GÖNDERİLİYOR...";
            btn.disabled = true;

            const payload = { acan, makine, vardiya, tur, aciklama, imgData: currentImageBase64 };

            fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(r => r.json())
            .then(res => {
                if (res.status === "success") {
                    alert("Başarıyla kaydedildi!");
                    location.reload();
                } else {
                    alert("Hata: " + res.message);
                }
            })
            .catch(err => alert("Hata oluştu: " + err.message))
            .finally(() => {
                btn.innerText = "KAYDI GÖNDER";
                btn.disabled = false;
            });
        }

        window.onload = fetchData;
    </script>
</body>
</html>
