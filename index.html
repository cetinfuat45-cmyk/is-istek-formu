<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ffffff">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <title>Arıza Bildirim Formu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=4.0">
</head>
<body>
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="top-bar-left"></div>
        <div class="top-bar-right">
            
        </div>
    </div>

    <!-- Horizontal Stepper -->
    <div class="stepper-wrapper">
        <div class="stepper-container">
            <div class="stepper-line"></div>
            
            <div class="step-item active" id="nav-step1" onclick="goToStep(1)">
                <div class="step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>
                <div class="step-badge"><div class="step-num">01</div><div class="step-text">AD SOYAD</div></div>
            </div>
            <div class="step-item" id="nav-step2" onclick="goToStep(2)">
                <div class="step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg></div>
                <div class="step-badge"><div class="step-num">02</div><div class="step-text">BÖLÜM</div></div>
            </div>
            <div class="step-item" id="nav-step3" onclick="goToStep(3)">
                <div class="step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="14" x2="23" y2="14"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="14" x2="4" y2="14"></line></svg></div>
                <div class="step-badge"><div class="step-num">03</div><div class="step-text">MAKİNE</div></div>
            </div>
            <div class="step-item" id="nav-step4" onclick="goToStep(4)">
                <div class="step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg></div>
                <div class="step-badge"><div class="step-num">04</div><div class="step-text">VARDİYA</div></div>
            </div>
            <div class="step-item" id="nav-step5" onclick="goToStep(5)">
                <div class="step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg></div>
                <div class="step-badge"><div class="step-num">05</div><div class="step-text">İŞ TÜRÜ</div></div>
            </div>
            <div class="step-item" id="nav-step6" onclick="goToStep(6)">
                <div class="step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg></div>
                <div class="step-badge"><div class="step-num">06</div><div class="step-text">AÇIKLAMA</div></div>
            </div>
            <div class="step-item" id="nav-step7" onclick="goToStep(7)">
                <div class="step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg></div>
                <div class="step-badge"><div class="step-num">07</div><div class="step-text">GÖNDER</div></div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <form id="faultForm" class="stepper-form">
            <!-- Step 1 -->
            <div class="card-step active" id="step1">
                <div class="card-header">
                    <h2>AD SOYAD</h2>
                    <button type="button" class="btn-ileri" onclick="nextStep(1)">İleri</button>
                </div>
                <div class="card-body">
                    <input type="text" id="userName" class="custom-input" required placeholder="Ad Soyad giriniz...">
                </div>
            </div>

            <!-- Step 2 -->
            <div class="card-step" id="step2">
                <div class="card-header">
                    <h2>BÖLÜM</h2>
                    <button type="button" class="btn-ileri" onclick="nextStep(2)">İleri</button>
                </div>
                <div class="card-body">
                    <select id="costCenter" class="custom-input custom-select" required>
                        <option value="">Seçiniz...</option>
                    </select>
                </div>
            </div>

            <!-- Step 3 -->
            <div class="card-step" id="step3">
                <div class="card-header">
                    <h2>MAKİNE</h2>
                    <button type="button" class="btn-ileri" onclick="nextStep(3)">İleri</button>
                </div>
                <div class="card-body">
                    <select id="machine" class="custom-input custom-select" required>
                        <option value="">Seçiniz...</option>
                    </select>
                </div>
            </div>

            <!-- Step 4 -->
            <div class="card-step" id="step4">
                <div class="card-header">
                    <h2>VARDİYA</h2>
                    <button type="button" class="btn-ileri" onclick="nextStep(4)">İleri</button>
                </div>
                <div class="card-body">
                    <select id="shift" class="custom-input custom-select" required>
                        <option value="">Seçiniz...</option>
                    </select>
                </div>
            </div>

            <!-- Step 5 -->
            <div class="card-step" id="step5">
                <div class="card-header">
                    <h2>İŞ TÜRÜ</h2>
                    <button type="button" class="btn-ileri" onclick="nextStep(5)">İleri</button>
                </div>
                <div class="card-body">
                    <select id="jobType" class="custom-input custom-select" required>
                        <option value="">Seçiniz...</option>
                    </select>
                </div>
            </div>

            <!-- Step 6 -->
            <div class="card-step" id="step6">
                <div class="card-header">
                    <h2>AÇIKLAMA</h2>
                    <button type="button" class="btn-ileri" onclick="nextStep(6)">İleri</button>
                </div>
                <div class="card-body">
                    <textarea id="description" class="custom-input custom-textarea" rows="4" required placeholder="Sorunu detaylıca açıklayın..."></textarea>
                </div>
            </div>

            <!-- Step 7 -->
            <div class="card-step" id="step7">
                <div class="card-header">
                    <h2></h2>
                    <!-- Gizli form submit butonu -->
                    <button type="submit" id="submitBtn" class="btn-ileri ready-to-submit">Gönder</button>
                </div>
                <div class="card-body">
                    <button type="button" id="openPhotoModalBtn" class="photo-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                        <span id="photoCompactText">Fotoğraf Ekle (Opsiyonel)</span>
                    </button>
                </div>
            </div>
        </form>
    </div>

    <!-- Bottom Power Button -->
    <div class="bottom-power-wrapper">
        <button type="button" class="btn-power" onclick="window.resetStepper()">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line></svg>
        </button>
    </div>

    <!-- Fotoğraf Seçim Modalı -->
    <div id="photoSelectionModal" class="modal-overlay hidden">
        <div class="modal-content" style="max-width: 320px; text-align: center; padding: 1.5rem; background: #fff;">
            <div style="display: flex; justify-content: flex-end;">
                <button type="button" class="close-modal" onclick="document.getElementById('photoSelectionModal').classList.add('hidden')" style="color: #333; font-size: 1.5rem; background: none; border: none; cursor: pointer;">×</button>
            </div>
            <h3 style="margin-bottom: 1.5rem; color: #333;">Fotoğraf Ekle</h3>
            <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">
            <input type="file" id="fileInput" accept="image/*" class="hidden">
            <button type="button" onclick="document.getElementById('cameraInput').click()" style="width: 100%; background: #e53e3e; color: white; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; font-size: 1rem; border: none; cursor: pointer;">Kameradan Çek</button>
            <button type="button" onclick="document.getElementById('fileInput').click()" style="width: 100%; background: rgba(229, 62, 62, 0.1); color: #e53e3e; border: 1px solid #e53e3e; border-radius: 12px; padding: 1rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; font-size: 1rem; cursor: pointer;">Dosyalardan Seç</button>
        </div>
    </div>

    <!-- Gönderim / Başarı Modalı -->
    <div id="submissionModal" class="modal-overlay hidden">
        <div class="modal-content" style="max-width: 400px; text-align: center; padding: 2rem; background: #fff;">
            <div id="loadingState">
                <div style="display: inline-block; width: 48px; height: 48px; border: 4px solid rgba(229, 62, 62, 0.3); border-top-color: #e53e3e; border-radius: 50%; animation: spin 1s infinite linear; margin-bottom: 1rem;"></div>
                <h3 style="color: #333; margin-bottom: 0.5rem;">Talebiniz Gönderiliyor...</h3>
                <p style="color: #666; font-size: 0.9rem;" id="loadingSubText">Lütfen bekleyin</p>
                <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
            </div>
            <div id="successState" class="hidden">
                <div style="width: 64px; height: 64px; background: rgba(16, 185, 129, 0.1); color: #10b981; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </div>
                <h3 style="color: #333; margin-bottom: 0.5rem;">Kayıt Başarılı!</h3>
                <p style="color: #666; margin-bottom: 1.5rem;">Ne yapmak istersiniz?</p>
                <div style="display: flex; flex-direction: column; gap: 0.8rem;">
                    <button type="button" onclick="window.location.reload()" style="background: #e53e3e; color: white; border-radius: 12px; padding: 1rem; border: none; font-weight: 600; font-size: 1rem; display:flex; justify-content:center; align-items:center; gap: 0.5rem; width:100%; cursor:pointer;">🔍 Ana Sayfaya Dön</button>
                    <button type="button" onclick="window.startNewForm()" style="background: rgba(229, 62, 62, 0.1); color: #e53e3e; border: 1px solid #e53e3e; border-radius: 12px; padding: 1rem; font-weight: 600; font-size: 1rem; display:flex; justify-content:center; align-items:center; gap: 0.5rem; width:100%; cursor:pointer;">📝 Yeni Form Doldur</button>
                    <button type="button" onclick="window.closeSystem()" style="background: rgba(100, 100, 100, 0.1); color: #666; border: 1px solid rgba(100, 100, 100, 0.2); border-radius: 12px; padding: 1rem; font-weight: 600; font-size: 1rem; display:flex; justify-content:center; align-items:center; gap: 0.5rem; width:100%; cursor:pointer;">❌ Sistemi Kapat (<span id="closeCountdown">10</span>)</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Admin Giriş Modalı -->
    <div id="adminLoginModal" class="modal-overlay hidden">
        <div class="modal-content" style="max-width: 350px; text-align: center; padding: 2rem; background: #fff;">
            <div style="display: flex; justify-content: flex-end;">
                <button type="button" class="close-modal" onclick="document.getElementById('adminLoginModal').classList.add('hidden')" style="color: #333; font-size: 1.5rem; background: none; border: none; cursor: pointer; padding: 0; margin-bottom: 1rem;">×</button>
            </div>
            <h3 style="color: #333; margin-bottom: 0.5rem; font-weight: 700;">Admin Girişi</h3>
            <input type="password" id="adminPasswordInput" placeholder="Şifrenizi Girin" style="width: 100%; text-align: center; font-size: 1.2rem; letter-spacing: 0.2rem; margin-bottom: 1rem;">
            <button type="button" onclick="submitAdminModalLogin()" style="width: 100%; background: #111827; color: #fff; border-radius: 12px; padding: 1rem; border: none; font-weight: 700; cursor: pointer;">Giriş Yap</button>
        </div>
    </div>

    <!-- Firebase SDK'ları -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    <script src="app.js?v=9.0"></script>
    <!-- Admin Login Corner Button -->
    <button type="button" class="btn-settings admin-login-corner" onclick="adminLogin()" style="position: fixed; bottom: 20px; right: 20px; z-index: 1000; background: rgba(0,0,0,0.1); color: var(--text-secondary); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid var(--panel-border);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 20px; height: 20px;">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
    </button>
</body>
</html>
